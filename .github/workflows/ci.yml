name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detectar módulos alterados
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
      backend_spring: ${{ steps.filter.outputs.backend_spring }}
      backend_jdbc: ${{ steps.filter.outputs.backend_jdbc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - '.github/workflows/**'
            backend_spring:
              - 'backend/**'
              - '!backend/jdbc/**'
              - '.github/workflows/**'
            backend_jdbc:
              - 'backend/jdbc/**'
              - '.github/workflows/**'

  pr-title:
    name: Validar título do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: Validar mensagens de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verificar commits do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  mobile:
    name: Mobile — Expo
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx expo-doctor@1.20.4

  web:
    name: Web — Next.js
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  backend-spring:
    name: Backend — Spring Boot
    needs: changes
    if: needs.changes.outputs.backend_spring == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  backend-jdbc:
    name: Backend — JDBC
    needs: changes
    if: needs.changes.outputs.backend_jdbc == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/jdbc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  quality-gate:
    name: CI — resultado geral
    if: always()
    needs:
      - changes
      - pr-title
      - commitlint
      - mobile
      - web
      - backend-spring
      - backend-jdbc
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado dos jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          PR_TITLE: ${{ needs.pr-title.result }}
          COMMITLINT: ${{ needs.commitlint.result }}
          MOBILE: ${{ needs.mobile.result }}
          WEB: ${{ needs.web.result }}
          BACKEND_SPRING: ${{ needs.backend-spring.result }}
          BACKEND_JDBC: ${{ needs.backend-jdbc.result }}
        run: |
          for result in "$CHANGES" "$PR_TITLE" "$COMMITLINT" "$MOBILE" "$WEB" "$BACKEND_SPRING" "$BACKEND_JDBC"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A CI falhou: um dos jobs terminou com estado $result."
              exit 1
            fi
          done
          echo "Todos os jobs aplicáveis foram aprovados."
