# .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela execuções antigas do mesmo PR quando chega um push novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # ATIVO: mobile (Expo; armazenamento local planejado com AsyncStorage)
  # ---------------------------------------------------------------
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Reativar quando conseguir configurar isso de um jeito eficaz
      # - run: npx prettier --check .
      # - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx expo-doctor
      # Roda os testes se o script "test" existir (jest-expo); não falha enquanto não houver
      - run: npm test --if-present -- --ci

  # ---------------------------------------------------------------
  # ATIVO: valida o título do PR (Conventional Commits)
  # ---------------------------------------------------------------
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

