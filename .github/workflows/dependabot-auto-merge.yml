name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  enable-auto-merge:
    name: Habilitar auto-merge para atualizações de baixo risco
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'eu-joao/gestao-academia-react' &&
      vars.DEPENDABOT_AUTO_MERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Obter metadados da atualização
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}

      - name: Solicitar integração automática
        if: >-
          steps.metadata.outputs.package-ecosystem == 'npm' &&
          steps.metadata.outputs.directory == '/web' &&
          steps.metadata.outputs.dependency-type == 'direct:development' &&
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          contains(fromJSON('["prettier","eslint","typescript","@types/node","@types/react","@types/react-dom"]'), steps.metadata.outputs.dependency-names)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --rebase "$PR_URL"
