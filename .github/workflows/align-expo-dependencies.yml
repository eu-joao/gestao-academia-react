name: Align Expo SDK dependencies

on:
  push:
    branches:
      - 129-fluxo-dependabot-seguro

permissions:
  contents: write

jobs:
  align-expo:
    if: github.ref == 'refs/heads/129-fluxo-dependabot-seguro'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 129-fluxo-dependabot-seguro
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install current dependencies
        run: npm ci
      - name: Align packages with the installed Expo SDK
        run: npx expo install --fix
      - name: Verify lockfile reproducibility
        run: npm ci
      - name: Validate Expo SDK compatibility
        run: npx expo-doctor@1.20.4
      - name: Validate production bundles
        run: npx expo export --platform all --output-dir /tmp/expo-export
      - name: Commit aligned dependencies and remove this temporary workflow
        working-directory: .
        env:
          BRANCH: 129-fluxo-dependabot-seguro
        run: |
          git config user.name "eu-joao"
          git config user.email "188712114+eu-joao@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git rm .github/workflows/align-expo-dependencies.yml
          git commit -m "fix(mobile): align Expo SDK dependencies" -m "Co-authored-by: Codex <codex@openai.com>"
          git push origin "HEAD:$BRANCH"
