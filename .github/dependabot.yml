version: 2
updates:
  # Expo SDK, React Native e bibliotecas nativas precisam permanecer compatíveis.
  # expo e react-native ficam sob atualização coordenada/manual do SDK.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "expo"
      - dependency-name: "react-native"
      # Evita atualizar isoladamente pacotes que acompanham a versão do SDK Expo.
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
        # Mantém dependências ligadas à matriz do Expo fora do grupo genérico.
        # Elas geram PRs individuais e continuam sujeitas ao expo-doctor na CI.
        exclude-patterns:
          - "expo*"
          - "@expo/*"
          - "react-native*"
          - "react"
          - "react-dom"
          - "@types/react"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      development-minor-and-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/backend/spring"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # O upgrade para Spring Boot 4 exige migração coordenada dos testes e dependências.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      # Springdoc 3.x não deve ser atualizado isoladamente enquanto o projeto usa Boot 3.x.
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types: ["version-update:semver-major"]
    groups:
      development-minor-and-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
